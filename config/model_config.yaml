# Model + LoRA hyperparameters.
# Rationale: Qwen2.5-VL-7B is the largest VLM that fits QLoRA 4-bit fine-tuning on a
# single 16GB T4 (Kaggle's free tier) — bigger variants (32B/72B) would need multi-GPU
# or paid compute, smaller VLMs (2B/3B class) sacrifice too much OCR/layout grounding
# for dense ID-document text.

model:
  # This is the real target model — the one Phase 4+ fine-tunes and the one the
  # reported baseline/final numbers are for. src/eval/clean_eval.py's
  # --model-name defaults to the much lighter Qwen2.5-VL-3B-Instruct instead,
  # purely so the zero-shot eval pipeline can be smoke-tested on local CPU;
  # every result it writes is labeled with whichever model_name actually ran.
  name: "Qwen/Qwen2.5-VL-7B-Instruct"
  revision: "main"
  trust_remote_code: true
  torch_dtype: "bfloat16"           # compute dtype; base weights loaded in 4-bit (see quantization block)
  # Dropped from 1280 after real Kaggle runs (kernel v9/v10) OOM'd in the SFT
  # backward pass on a T4 by ~1.4-1.7GB even after fixing the training path's
  # image-resize (was uncapped) and allocator fragmentation
  # (PYTORCH_CUDA_ALLOC_CONF=expandable_segments). Combined with lora.r below
  # (moderate cut on two axes rather than a large cut on one) to close the gap
  # while limiting the hit to field-extraction accuracy on dense ID text.
  max_image_size: 896               # px, longer side — balances OCR legibility vs vision-token budget

quantization:
  # QLoRA: load frozen base in 4-bit NF4, train only LoRA adapters in bf16.
  # This is what makes 7B trainable on a T4's 16GB VRAM at all.
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  # Dropped from r=16/alpha=32 to r=12/alpha=24 (same 2x alpha:r ratio, so the
  # effective LoRA scaling is unchanged) alongside the max_image_size cut
  # above — real Kaggle runs OOM'd in the SFT backward pass on a T4 by
  # ~1.4-1.7GB, and trainable-param gradient memory is one of the two
  # concrete levers that actually reduces backward-pass memory (unlike e.g.
  # batch size, already at its floor of 1). Revisit rank upward only if
  # underfitting shows in Phase 4 clean-eval numbers, now that VRAM allows it.
  r: 12
  alpha: 24
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

generation:
  # Deterministic decoding for extraction/detection (reproducible eval); explanation
  # generation (DPO stage) can override with sampling at inference time if needed.
  max_new_tokens: 768
  do_sample: false
  temperature: 1.0
