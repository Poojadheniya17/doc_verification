# Training run settings. environment: "local" runs tiny-sample smoke tests on CPU;
# environment: "kaggle" runs real training on a T4/P100. Same script, different config —
# see src/utils for the env-resolution helper (Phase 2+).
#
# IMPORTANT (found in Phase 3): this dev machine has only ~7.7GB RAM. Loading
# Qwen2.5-VL at ANY size (even 3B, even for a "quick local smoke test") caused
# severe disk thrashing, not just slowness. "local" smoke tests must therefore
# stop at data/manifest/config logic — no model weights ever get loaded in the
# local environment. Any script that needs an actual forward/backward pass
# through the VLM runs on Kaggle, full stop, regardless of model size.

environment: "local"   # "local" | "kaggle" — override via CLI flag, never hardcode in scripts

paths:
  local:
    data_root: "./data"
    output_root: "./results"
    checkpoint_root: "./checkpoints"
  kaggle:
    # Kaggle mounts input datasets read-only under /kaggle/input and writable
    # scratch under /kaggle/working — these must be dataset/kernel slugs you push.
    # The dataset (poojadheniya/doc-verification-data) was packaged by
    # src/utils/kaggle_package.py preserving the local repo's "data/..." prefix,
    # so data_root must point AT that data/ subfolder to match local's "./data"
    # (which directly contains raw/processed/synthetic_forgeries) — found this
    # mismatch (data_root pointed at the dataset root instead) before the first
    # real Kaggle push, since sft_train.py builds sub-paths as
    # data_root / "processed" / ... the same way for both environments.
    data_root: "/kaggle/input/doc-verification-data/data"
    output_root: "/kaggle/working/results"
    checkpoint_root: "/kaggle/working/checkpoints"

sft:
  # Batch size 1 + grad accumulation 16 (effective batch 16). Real Kaggle runs
  # (kernel v8-v10) found even this OOMs a T4's 16GB VRAM at max_image_size
  # 1280 in the backward pass — see model_config.yaml's max_image_size/lora.r
  # comments for the full progression. Do not raise per-device batch size
  # without re-checking VRAM headroom on Kaggle first; there's currently zero
  # slack.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  num_epochs: 3
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  # 2048 -> 1024 (v23) -> 2048 (v25 attempt 1, restored) -> 1536 (v25
  # attempt 2, this value). Attempt 1 (2048 + max_image_size=768 + lora.r=16,
  # all restored at once) OOM'd using 14.55 of a 14.56GiB budget — see
  # model_config.yaml's max_image_size comment for the exact traceback and
  # reasoning. Backing off to a middle ground (1536, still 1.5x v24's 1024
  # floor) alongside max_image_size's matching step-down, rather than
  # isolating exactly which of the two mattered more — time-boxed to a
  # capped number of attempts, not a full grid search. Still genuinely wired
  # into sft_train.py's collate() (fixed in v23, not decorative).
  max_seq_length: 1536
  save_strategy: "epoch"
  logging_steps: 10
  # Kaggle free tier gives ~30 GPU-hrs/week — 3 epochs on a few-thousand-sample
  # synthetic set is sized to fit comfortably within a single session (~9hr max runtime).
  # If dataset size grows materially, drop epochs before raising session count.

dpo:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-5
  num_epochs: 1
  beta: 0.1                 # DPO temperature; 0.1 is the standard default, not tuned yet
  max_seq_length: 2048

adversarial_rounds:
  # 3 rounds chosen deliberately: each round = eval on held-out tier -> mine failures ->
  # targeted retrain. More rounds would be more rigorous but 3 is the most that fits
  # Kaggle's weekly free-GPU quota alongside the other experiments (leave-one-out, DPO,
  # quantization bench) in the same week. Flagged here rather than silently scaled down.
  num_rounds: 3
  failure_sample_cap: 200   # max mined failure cases retrained on per round, VRAM/time bound

leave_one_out:
  tiers:
    - tier1_field_tamper
    - tier2_splicing
    - tier3_inpainting
    - tier4_full_synthetic
    - tier5_recapture
  # Each fold trains on 4 tiers, evals generalization to the held-out 5th.
  # Bootstrap resampling for CIs rather than repeated full retrains — repeated retrains
  # per fold (for true variance estimates) would exceed the weekly GPU quota.
  bootstrap_resamples: 1000
  confidence_level: 0.95

quantization_bench:
  precisions: ["fp16", "int8", "int4"]
  # 200 was this value's original placeholder, sized for a much larger corpus
  # than this project actually built. Real data available: 150 test-split
  # genuine images + ~55 tampered examples pooled across all 5 tiers (see
  # results/tables/phase6_leave_one_out_summary.md for the exact per-tier
  # breakdown). Scoped down to a real, honestly-sized sample instead of
  # requesting more examples than exist: eval_sample_size now means
  # "genuine examples included" (n_genuine passed to
  # adversarial_rounds.build_eval_set(), reused here rather than
  # duplicating the same balanced-sampling logic) - every available tampered
  # example is included uncapped on top of that, same rationale as
  # build_eval_set()'s own docstring. 20 genuine + ~55 tampered = ~75 total,
  # run once per precision (3x) - realistic for a single Kaggle session.
  eval_sample_size: 20
