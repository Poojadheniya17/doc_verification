# Model + LoRA hyperparameters.
# Rationale: Qwen2.5-VL-7B is the largest VLM that fits QLoRA 4-bit fine-tuning on a
# single 16GB T4 (Kaggle's free tier) — bigger variants (32B/72B) would need multi-GPU
# or paid compute, smaller VLMs (2B/3B class) sacrifice too much OCR/layout grounding
# for dense ID-document text.

model:
  # This is the real target model — the one Phase 4+ fine-tunes and the one the
  # reported baseline/final numbers are for. src/eval/clean_eval.py's
  # --model-name defaults to the much lighter Qwen2.5-VL-3B-Instruct instead,
  # purely so the zero-shot eval pipeline can be smoke-tested on local CPU;
  # every result it writes is labeled with whichever model_name actually ran.
  name: "Qwen/Qwen2.5-VL-7B-Instruct"
  revision: "main"
  trust_remote_code: true
  torch_dtype: "bfloat16"           # compute dtype; base weights loaded in 4-bit (see quantization block)
  # Dropped 1280->896->768 across three real Kaggle runs. v9/v10 (1280, then
  # 896) OOM'd cleanly in the SFT backward pass by ~1.4-1.7GB. v11 (896 +
  # lora.r=12, see below) didn't OOM at all this time — it silently STALLED at
  # the exact same backward-pass line for 39 minutes with zero progress and no
  # crash, most likely paged_adamw_8bit paging to host memory under pressure
  # rather than erroring (see training_config.yaml's sft.optim comment: the
  # optimizer itself was also changed, not just this value, in response).
  # 768 + lora.r=8 is the most aggressive cut still expected to leave the
  # model useful, applied together with dropping the paged optimizer so this
  # targets the suspected root cause (paging under pressure) rather than only
  # the symptom (footprint).
  max_image_size: 768               # px, longer side — balances OCR legibility vs vision-token budget

quantization:
  # QLoRA: load frozen base in 4-bit NF4, train only LoRA adapters in bf16.
  # This is what makes 7B trainable on a T4's 16GB VRAM at all.
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  # r=16 -> r=12 -> r=8 (alpha kept at 2x r throughout, so LoRA's effective
  # scaling is unchanged at every step). r=12 didn't OOM but stalled (see
  # model.max_image_size comment) — r=8 is the most aggressive rank cut still
  # expected to leave the adapter useful; revisit upward only once a run
  # actually completes and clean-eval numbers show underfitting.
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

generation:
  # Deterministic decoding for extraction/detection (reproducible eval); explanation
  # generation (DPO stage) can override with sampling at inference time if needed.
  max_new_tokens: 768
  do_sample: false
  temperature: 1.0
